name: Deploy React App to Azure Web App

on:
  push:
    branches:
      - main

  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  NODE_VERSION: "24"
  AZURE_WEBAPP_NAME: "default-react-app"

jobs:
  build-and-deploy-to-azure:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build React app
        run: npm run build

      - name: Check Azure secrets
        env:
          AZURE_CLIENT_ID: ${{ secrets.AZURE_CLIENT_ID }}
          AZURE_TENANT_ID: ${{ secrets.AZURE_TENANT_ID }}
          AZURE_SUBSCRIPTION_ID: ${{ secrets.AZURE_SUBSCRIPTION_ID }}
        run: |
          if [ -z "$AZURE_CLIENT_ID" ]; then
            echo "AZURE_CLIENT_ID is missing"
            exit 1
          fi

          if [ -z "$AZURE_TENANT_ID" ]; then
            echo "AZURE_TENANT_ID is missing"
            exit 1
          fi

          if [ -z "$AZURE_SUBSCRIPTION_ID" ]; then
            echo "AZURE_SUBSCRIPTION_ID is missing"
            exit 1
          fi

          echo "All Azure secrets are available."

      - name: Azure CLI Login
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Deploy to Azure Web App
        uses: azure/webapps-deploy@v3
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ./dist
